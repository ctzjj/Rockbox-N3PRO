name: "Build release artifacts"

# Builds the N3Pro port whenever a release is published, or on demand.
# The build uses the exact toolchain the port is developed with
# (mipsel-rockbox-linux-gnu, GCC 9.5.0), stored as an asset of the
# internal "toolchain-v1" prerelease.
#
# Flashable image: the *stock* firmware is kept once in the internal
# "stock-firmware" release (asset "stock-update.upt", same idea as the
# toolchain) and fetched from there; the patcher turns it into
# n3pro_rockbox.upt.  A "stock-update.upt" asset attached to the release
# itself still overrides it (useful to build against a different stock
# version).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload artifacts to (empty = build check only)"
        default: ""
        required: false

permissions:
  contents: write

env:
  TOOLCHAIN_URL: "https://github.com/ctzjj/Rockbox-N3PRO/releases/download/toolchain-v1/rockbox-toolchain-mipsel.tar.xz"
  TOOLCHAIN_MD5: "d79ee6d6ca89186fb72d893c0ffd72f7"
  STOCK_URL: "https://github.com/ctzjj/Rockbox-N3PRO/releases/download/stock-firmware/stock-update.upt"

jobs:
  # The stock-firmware release and the rolling channel tags never build
  # anything themselves (the channels are created by this very job).
  build:
    if: ${{ github.event_name != 'release' || (github.event.release.tag_name != 'stock-firmware' && github.event.release.tag_name != 'v1.x' && github.event.release.tag_name != 'v2.x' && github.event.release.tag_name != 'v3.x') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zip

      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Restore toolchain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/rockbox-toolchain
          key: toolchain-mipsel-v1

      - name: Download toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/tc.tar.xz "$TOOLCHAIN_URL"
          echo "$TOOLCHAIN_MD5  /tmp/tc.tar.xz" | md5sum -c -
          tar -xJf /tmp/tc.tar.xz -C "$HOME"

      - name: Put toolchain on PATH
        run: echo "$HOME/rockbox-toolchain/bin" >> "$GITHUB_PATH"

      - name: Fetch Rockbox source and apply the port patch
        run: |
          # The base commit is recorded in the patch header by the
          # collection script, so rebasing the port only means
          # regenerating n3pro_port.patch.
          #
          # Keep the checkout at a short path: the generated make
          # dependency rule passes every source file on one /bin/sh
          # command line, and the runner's long workspace path pushes it
          # over the kernel's 128k limit for a single argument.
          BASE=$(sed -n 's/^# rockbox-base: //p' n3pro_port.patch | head -1)
          [ -n "$BASE" ] || { echo "::error::no '# rockbox-base:' header in n3pro_port.patch"; exit 1; }
          echo "building against rockbox $BASE"
          git clone --quiet https://github.com/Rockbox/rockbox /tmp/rb
          git -C /tmp/rb checkout --quiet "$BASE"
          # lib/lvgl is a submodule in the n3pro-lvgl line: the patch only
          # carries the gitlink, so stage the patch and fetch the pinned LVGL
          # sources (shallow: just that commit) before building.
          git -C /tmp/rb apply --check --binary "$GITHUB_WORKSPACE/n3pro_port.patch"
          git -C /tmp/rb apply --index --binary "$GITHUB_WORKSPACE/n3pro_port.patch"
          git -C /tmp/rb config submodule.lib/lvgl.shallow true
          git -C /tmp/rb submodule update --init lib/lvgl
          test -f /tmp/rb/lib/lvgl/lvgl.h || { echo "::error::lib/lvgl sources missing"; exit 1; }

      - name: Build application and the SD payload zip
        run: |
          mkdir -p /tmp/rb-build && cd /tmp/rb-build
          /tmp/rb/tools/configure --target=n3pro --type=N
          make -j"$(nproc)" > /dev/null
          make fullzip
          mv rockbox-full.zip "$GITHUB_WORKSPACE/rockbox-n3pro.zip"
          md5sum "$GITHUB_WORKSPACE/rockbox-n3pro.zip"

      - name: Build bootloader
        run: |
          mkdir -p /tmp/rb-build-bl && cd /tmp/rb-build-bl
          /tmp/rb/tools/configure --target=n3pro --type=B
          make -j"$(nproc)" > /dev/null
          cp bootloader.n3pro "$GITHUB_WORKSPACE/bootloader.n3pro"
          md5sum "$GITHUB_WORKSPACE/bootloader.n3pro"

      - name: Build the flashable image (stock firmware)
        id: upt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          # A per-release stock asset overrides the shared one.
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "${{ github.repository }}" \
               --pattern 'stock-update.upt' -O /tmp/stock.upt 2>/dev/null || true
          fi
          if [ ! -s /tmp/stock.upt ]; then
            curl -fL --retry 3 -o /tmp/stock.upt "$STOCK_URL" || rm -f /tmp/stock.upt
          fi
          if [ -s /tmp/stock.upt ]; then
            sudo apt-get install -y -q p7zip-full genisoimage mtd-utils python3-pip
            python3 -m pip install --user --break-system-packages ubi_reader ||
              python3 -m pip install --user ubi_reader
            export PATH="$HOME/.local/bin:$PATH"
            cd "$GITHUB_WORKSPACE"
            mv /tmp/stock.upt stock-update.upt
            /tmp/rb/firmware/target/hosted/cayin/n3pro/n3pro_patcher.sh \
                stock-update.upt bootloader.n3pro
            mv stock-update_rb.upt n3pro_rockbox.upt
            rm stock-update.upt
            md5sum n3pro_rockbox.upt
          else
            echo "no stock firmware available; skipping the .upt image"
          fi

      - name: Keep artifacts from manual runs
        if: ${{ !inputs.tag && !github.event.release }}
        uses: actions/upload-artifact@v4
        with:
          name: n3pro-build-${{ github.run_number }}
          path: |
            rockbox-n3pro.zip
            bootloader.n3pro
            n3pro_rockbox.upt
          if-no-files-found: ignore

      - name: Upload artifacts to the release
        if: ${{ inputs.tag || github.event.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          cd "$GITHUB_WORKSPACE"
          files="rockbox-n3pro.zip"
          [ -f n3pro_rockbox.upt ] && files="$files n3pro_rockbox.upt"
          gh release upload "$TAG" $files --clobber -R "${{ github.repository }}"
          if gh release view "$TAG" -R "${{ github.repository }}" --json assets \
             -q '.[].name' | grep -qx 'stock-update.upt'; then
            gh release delete-asset "$TAG" stock-update.upt -y \
               -R "${{ github.repository }}" || true
          fi
          # keep the rolling channel of this branch in step with every
          # release: n3pro-rockbox -> v1.x, n3pro-custom -> v2.x, main -> v3.x
          BRANCH="${{ github.event.release.target_commitish }}"
          [ -n "$BRANCH" ] || BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            n3pro-rockbox) CH=v1.x; LINE="v1.x (stock-rockbox line)" ;;
            n3pro-custom)  CH=v2.x; LINE="v2.x (custom line)" ;;
            *)             CH=v3.x; LINE="v3.x (LVGL line)"; BRANCH=main ;;
          esac
          gh release view "$CH" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$CH" -R "${{ github.repository }}" \
               --target "$BRANCH" \
               --title "$LINE (rolling)" \
               --notes "Rolling build of the $LINE, refreshed on every release of the $BRANCH branch. Same artifacts as its newest version tag." \
               --prerelease
          gh release upload "$CH" $files --clobber -R "${{ github.repository }}"
