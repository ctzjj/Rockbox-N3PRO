<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<link rel="icon" href="data:,">
<title>Rockbox</title>
<style>
:root{--red:#ec4141;--txt:#f2f3f7;--mut:#9aa0b4;
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%}
/* outside the 720p column: plain white surround, nothing else */
body{background:#fff;color:var(--txt);overflow:hidden;height:100dvh;
  display:flex;align-items:stretch;justify-content:center;
  font-family:-apple-system,"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
/* the app page: 720p wide, full height, gradient blocks INSIDE */
.card{position:relative;isolation:isolate;overflow:hidden;width:min(720px,100vw);height:100dvh;
  display:flex;flex-direction:column;align-items:center;color:var(--txt);
  padding:calc(14px + env(safe-area-inset-top)) 34px calc(96px + env(safe-area-inset-bottom));
  background:#0b0e17}
.card::before{content:"";position:absolute;left:-12%;right:-12%;top:-18%;bottom:-18%;
  z-index:-1;filter:blur(52px);background:
  radial-gradient(42% 36% at 16% 20%,rgba(236,65,65,.34) 0%,transparent 68%),
  radial-gradient(46% 40% at 84% 16%,rgba(122,88,255,.32) 0%,transparent 70%),
  radial-gradient(48% 44% at 72% 84%,rgba(38,132,255,.26) 0%,transparent 70%),
  radial-gradient(40% 36% at 22% 86%,rgba(20,190,150,.16) 0%,transparent 70%)}
.card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,14,23,.25),rgba(11,14,23,.65))}
@media(min-width:760px){.card{box-shadow:0 0 60px rgba(0,0,0,.18)}}
/* light theme */
.card.lt{background:#edf0f6;--txt:#1d2230;--mut:#5c6578;
  --line:rgba(20,30,60,.12);--glass2:rgba(255,255,255,.5)}
.card.lt::before{background:
  radial-gradient(42% 36% at 16% 20%,rgba(236,65,65,.22) 0%,transparent 68%),
  radial-gradient(46% 40% at 84% 16%,rgba(122,88,255,.20) 0%,transparent 70%),
  radial-gradient(48% 44% at 72% 84%,rgba(38,132,255,.18) 0%,transparent 70%),
  radial-gradient(40% 36% at 22% 86%,rgba(20,190,150,.12) 0%,transparent 70%)}
.card.lt::after{background:linear-gradient(180deg,rgba(237,240,246,.35),rgba(237,240,246,.78))}
/* corner pills */
.tr{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;
  z-index:60;display:flex;gap:8px}
.lang{background:var(--glass2);backdrop-filter:blur(18px);border:1px solid var(--line);
  color:var(--txt);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.lang:active{transform:scale(.93)}
.thm{width:40px;height:37px;padding:0;display:flex;
  align-items:center;justify-content:center}
.thm svg{width:18px;height:18px}
.tl{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;
  z-index:60;display:flex;gap:8px}
/* battery pill + shutdown button, top left */
.batt{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);
  background:var(--glass2);backdrop-filter:blur(18px);border:1px solid var(--line);
  border-radius:999px;padding:9px 13px}
.batt svg{width:25px;height:13px;display:block}
.batt.low{color:#ff5f56}
/* vinyl -- black record material in BOTH themes */
.discwrap{position:relative;width:min(360px,60vw);margin:auto 0 26px}
.disc{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:conic-gradient(from 0deg,#0a0b10,#14161f,#0a0b10,#1a1d29,#0a0b10);
  box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.07);
  animation:spin 24s linear infinite}
.card.lt .disc{box-shadow:0 24px 60px rgba(40,50,90,.3),inset 0 0 0 1px rgba(255,255,255,.25)}
.disc.paused{animation-play-state:paused}
.disc img{width:78%;height:78%;object-fit:cover;border-radius:50%;margin:11%;
  box-shadow:0 0 0 1px rgba(255,255,255,.09)}
/* brass spindle: the turntable centre the record spins on */
.hole{position:absolute;top:50%;left:50%;width:9%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);z-index:3;
  background:radial-gradient(circle at 38% 34%,#f6dda1 0%,#d9ae5c 42%,#a97c2c 78%,#7a5817 100%);
  box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 0 5px rgba(226,186,110,.30),
   inset 0 1px 2px rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.6)}
/* tonearm: swings onto the record while playing, off it when paused */
.arm{position:absolute;top:-4%;right:-3%;width:72%;aspect-ratio:1;z-index:5;
  pointer-events:none;transform-origin:83% 15%;transform:rotate(-36deg);
  transition:transform .7s cubic-bezier(.3,.85,.3,1)}
.arm.off{transform:rotate(-58deg)}
.arm svg{width:100%;height:100%;display:block;filter:drop-shadow(2px 3px 5px rgba(0,0,0,.45))}
/* no cover: red vinyl label instead of the album image */
.disc.noaa img{display:none}
.disc.noaa::after{content:"";position:absolute;top:11%;left:11%;width:78%;height:78%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#f05050 0%,#e14343 46%,#c93a3a 62%,#a83232 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 0 22px rgba(0,0,0,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
/* play view */
#playView{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.trow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  width:100%;margin-top:4px}
.tcol{min-width:0;flex:1}
h1{font-size:24px;font-weight:700;letter-spacing:.3px;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mut);font-size:15px;text-align:left;margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{display:flex;gap:10px;flex:none}
.ico button{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);
  background:var(--glass2);backdrop-filter:blur(14px);color:var(--txt);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.ico button:active{transform:scale(.88)}
.ico svg{width:21px;height:21px}
.ico button.dim{color:var(--mut)}
.bar{position:relative;height:30px;display:flex;align-items:center;cursor:pointer;
  margin-top:16px;width:100%;touch-action:none}
.track{position:relative;width:100%;height:5px;border-radius:3px;
  background:rgba(255,255,255,.13)}
.card.lt .track{background:rgba(20,30,60,.14)}
.fill{position:absolute;height:100%;border-radius:3px;background:var(--red);width:0}
.dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 6px rgba(0,0,0,.5);transform:translate(-50%,-50%);left:0}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;
  margin-top:3px;width:100%}
.ctr{display:flex;align-items:center;justify-content:center;gap:52px;margin-top:28px}
.ctr button{background:none;border:0;color:var(--txt);cursor:pointer;padding:10px;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
.ctr button:active{transform:scale(.88)}
.ctr svg{width:42px;height:42px;display:block}
.big{width:92px;height:92px;border-radius:50%;background:var(--red)!important;
  box-shadow:0 14px 36px rgba(236,65,65,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.big svg{width:42px;height:42px;margin:0 auto}
/* floating vertical volume panel */
#volWrap{position:absolute;top:50%;right:18px;
  transform:translate(calc(100% + 60px),-50%);
  transition:transform .28s cubic-bezier(.2,.9,.25,1);z-index:55;width:66px;height:min(320px,46dvh);
  background:rgba(18,21,33,.55);backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--line);border-radius:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;padding:18px 0 12px}
.card.lt #volWrap{background:rgba(255,255,255,.5)}
#volWrap.open{transform:translate(0,-50%)}
.vslider{flex:1;width:100%;position:relative;touch-action:none;cursor:pointer}
.vtrack{position:absolute;left:50%;top:6px;bottom:6px;width:6px;transform:translateX(-50%);
  border-radius:3px;background:rgba(255,255,255,.14)}
.card.lt .vtrack{background:rgba(20,30,60,.12)}
.vfill{position:absolute;bottom:0;left:0;width:100%;border-radius:3px;background:var(--red);height:0}
.vdot{position:absolute;left:50%;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 6px rgba(0,0,0,.5);transform:translate(-50%,50%);bottom:0}
.vnum{color:var(--txt);font-size:15px;padding-top:12px;flex:none}
/* files view */
#filesView{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:42px}
.fhead{display:flex;align-items:center;gap:10px;min-height:37px}
.crumb{flex:1;display:flex;align-items:center;overflow-x:auto;white-space:nowrap;
  font-size:13px;color:var(--mut);gap:4px;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb b{color:var(--txt);cursor:pointer;font-weight:600;flex:none}
.crumb b:hover{color:var(--red)}
.crumb span{opacity:.5;flex:none}
.fup{flex:none;display:flex;align-items:center;gap:7px;padding:9px 17px;
  border-radius:999px;border:1px solid var(--line);background:var(--glass2);
  color:var(--txt);font-size:13px;cursor:pointer}
.fup:active{transform:scale(.94)}
.fup svg{width:15px;height:15px}
.flist{flex:1;overflow-y:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
.frow{display:flex;align-items:center;gap:11px;padding:12px 10px;font-size:15px;
  border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;border-radius:10px}
.card.lt .frow{border-bottom-color:rgba(20,30,60,.07)}
.frow:active{background:rgba(255,255,255,.08)}
.card.lt .frow:active{background:rgba(20,30,60,.06)}
.frow svg{width:19px;height:19px;flex:none;color:var(--mut)}
.frow.isdir svg{color:#f0b64a}
.fname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* bottom navigation -- spans the full column width */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:58;
  display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--glass2);backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 30px;border-radius:16px;border:0;background:none;color:var(--mut);
  font-size:11px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{background:rgba(236,65,65,.16);color:var(--red)}
/* file action popup + confirm */
.ovl{position:absolute;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;
  background:rgba(6,8,14,.4)}
.card.lt .ovl{background:rgba(120,130,160,.25)}
.fcard{width:min(320px,84%);background:rgba(24,27,40,.88);backdrop-filter:blur(30px);
  border:1px solid var(--line);border-radius:22px;padding:20px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.card.lt .fcard{background:rgba(250,250,253,.92)}
.fcard .fname{font-size:15px;word-break:break-all;margin-bottom:4px;color:var(--txt)}
.fcard p{font-size:14px;color:var(--mut);text-align:center;word-break:break-all}
.fcard button{padding:13px;border-radius:14px;border:1px solid var(--line);
  background:var(--glass2);color:var(--txt);font-size:14px;cursor:pointer}
.fcard button:active{transform:scale(.97)}
.fcard button.go{background:var(--red);border-color:transparent;color:#fff;font-weight:600}
.fcard button.dngr{color:#ff6b6b}
.fcard .row{display:flex;gap:10px}
.fcard .row button{flex:1}
/* playlist sheet */
#plWrap{position:fixed;inset:0;background:rgba(6,8,14,.45);backdrop-filter:blur(10px);
  z-index:70;display:flex;align-items:flex-end;justify-content:center;color:#f2f3f7}
body.lt #plWrap{color:#1d2230}
.sheet{width:min(720px,100vw);height:70vh;background:rgba(20,23,35,.6);
  backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);
  border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
  box-shadow:0 -20px 60px rgba(0,0,0,.5)}
body.lt #plWrap .sheet{background:rgba(248,249,252,.72)}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet h2{font-size:17px}
.sheet header button{background:var(--glass2);border:1px solid var(--line);color:var(--txt);
  border-radius:999px;padding:7px 18px;font-size:13px;cursor:pointer}
#plList{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
#plList div{padding:13px 8px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:10px}
#plList div:active{background:rgba(255,255,255,.08)}
#plList div.cur{color:var(--red)}
#plList div.cur::before{content:"▶";font-size:11px;margin-right:8px}
/* upload progress + toast + drop hint */
#upBox{position:absolute;left:14px;right:14px;
  bottom:calc(96px + env(safe-area-inset-bottom));z-index:62;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.uprow{background:rgba(20,23,35,.78);backdrop-filter:blur(24px);border:1px solid var(--line);
  border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.card.lt .uprow{background:rgba(250,250,253,.88)}
.uprow .l1{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);gap:12px}
.uprow .l1 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uprow .l1 .p{color:var(--txt);flex:none}
.uprow .pb{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.card.lt .uprow .pb{background:rgba(20,30,60,.1)}
.uprow .pb i{display:block;height:100%;background:var(--red);width:0;transition:width .15s;border-radius:3px}
#toast{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom));z-index:63;
  background:rgba(20,23,35,.85);backdrop-filter:blur(20px);border:1px solid var(--line);
  color:var(--txt);padding:10px 22px;border-radius:999px;font-size:13px;opacity:0;
  transition:opacity .25s;pointer-events:none;white-space:nowrap}
.card.lt #toast{background:rgba(250,250,253,.92)}
#toast.show{opacity:1}
#dropOv{position:absolute;inset:10px;z-index:64;border:2px dashed rgba(255,255,255,.35);
  border-radius:24px;background:rgba(10,12,20,.55);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--txt);
  text-align:center;padding:20px}
.card.lt #dropOv{border-color:rgba(20,30,60,.3);background:rgba(237,240,246,.55)}
/* login */
#login{position:fixed;inset:0;background:rgba(8,10,17,.55);backdrop-filter:blur(26px);
  -webkit-backdrop-filter:blur(26px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;z-index:80}
#login .logo{width:74px;height:74px;border-radius:50%;background:var(--red);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 36px rgba(236,65,65,.45)}
#login .logo svg{width:34px;height:34px}
#login p{color:var(--mut);font-size:15px}
#code{width:224px;padding:14px 0;font-size:28px;letter-spacing:14px;text-indent:14px;
  text-align:center;text-transform:uppercase;background:var(--glass2);
  border:1px solid var(--line);border-radius:16px;color:var(--txt);outline:none}
#code:focus{border-color:var(--red)}
#login button.go{padding:14px 54px;border:0;border-radius:999px;background:var(--red);
  color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#err{color:var(--red);font-size:13px;min-height:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="plWrap" hidden onclick="togglePl(false)">
  <div class="sheet" onclick="event.stopPropagation()">
    <header><h2 id="plTitle">Playlist</h2><button onclick="togglePl(false)">✕</button></header>
    <div id="plList"></div>
  </div>
</div>

<div id="login">
  <div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
  <p id="hint">Enter the code shown on the player</p>
  <input id="code" maxlength="6" autocapitalize="characters" autocomplete="off">
  <div id="err"></div>
  <button class="go" id="loginBtn" onclick="login()">Enter</button>
</div>

<div class="card" id="main" hidden>
  <div class="tl">
    <div class="batt" id="batt">
      <svg viewBox="0 0 28 14"><rect x="1" y="1" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect id="battFill" x="3.5" y="3.5" width="17" height="7" rx="1.5" fill="currentColor"/><rect x="24.5" y="4.5" width="2.5" height="5" rx="1" fill="currentColor"/></svg>
      <span id="battPct">-</span>
    </div>
    <button class="lang thm" id="sdBtn" aria-label="shutdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.2 6.2a8 8 0 1 0 11.6 0"/></svg></button>
  </div>
  <div class="tr">
    <button class="lang thm" id="thBtn" aria-label="theme"></button>
    <button class="lang" id="langBtn">EN</button>
  </div>

  <div id="playView">
    <div class="discwrap">
      <div class="disc paused" id="disc"><img id="cover" alt=""></div>
      <div class="hole"></div>
      <div class="arm off" id="arm"><svg viewBox="0 0 100 100">
        <line x1="84" y1="17" x2="36" y2="70" stroke="#b7bfd2" stroke-width="4.6" stroke-linecap="round"/>
        <line x1="84" y1="17" x2="36" y2="70" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-linecap="round"/>
        <g transform="rotate(38 36 72)"><rect x="28" y="66" width="16" height="12" rx="3" fill="#252a38" stroke="#3a4154" stroke-width="1"/></g>
        <line x1="35" y1="78" x2="31.5" y2="86" stroke="#e3e8f2" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="84" cy="17" r="7.5" fill="#ccd2e0"/>
        <circle cx="84" cy="17" r="3.2" fill="#7c8499"/>
      </svg></div>
    </div>
    <div class="trow">
      <div class="tcol">
        <h1 id="title">-</h1>
        <div class="sub" id="artist">-</div>
      </div>
      <div class="ico">
        <button id="repBtn" class="dim" aria-label="repeat"><svg id="repIco" viewBox="0 0 24 24" fill="currentColor"></svg></button>
        <button id="plBtn" aria-label="playlist"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-9 5 4-5 4z"/></svg></button>
        <button id="volBtn" aria-label="volume"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      </div>
    </div>
    <div class="bar" id="bar"><div class="track"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div></div>
    <div class="times"><span id="pos">0:00</span><span id="len">0:00</span></div>
    <div class="ctr">
      <button onclick="cmd('prev')" aria-label="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="big" id="pp" onclick="cmd('playpause')" aria-label="play"><svg id="ppIcon" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>
      <button onclick="cmd('next')" aria-label="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </div>

  <div id="filesView" hidden>
    <div class="fhead">
      <div class="crumb" id="crumb"></div>
      <button class="fup" id="upBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 5 10h4v8h6v-8h4l-7-7zM5 19h14v2H5z"/></svg><span id="upLbl">Upload</span></button>
    </div>
    <div class="flist" id="fList"></div>
  </div>

  <div id="volWrap">
    <div class="vslider" id="vslider">
      <div class="vtrack"><div class="vfill" id="vfill"></div><div class="vdot" id="vdot"></div></div>
    </div>
    <div class="vnum" id="vnum">50</div>
  </div>

  <div id="fMenu" class="ovl" hidden onclick="closeFMenu()">
    <div class="fcard" onclick="event.stopPropagation()">
      <div class="fname" id="fMenuName"></div>
      <button class="go" id="fPlay"></button>
      <button class="dngr" id="fDel"></button>
      <button id="fCancel"></button>
    </div>
  </div>

  <div id="fConfirm" class="ovl" hidden onclick="this.hidden=true">
    <div class="fcard" onclick="event.stopPropagation()">
      <p id="cfName"></p>
      <div class="row">
        <button class="go" id="cfYes"></button>
        <button id="cfNo"></button>
      </div>
    </div>
  </div>

  <div id="sdWrap" class="ovl" hidden onclick="this.hidden=true">
    <div class="fcard" onclick="event.stopPropagation()">
      <p id="sdText"></p>
      <div class="row">
        <button class="dngr" id="sdYes"></button>
        <button id="sdNo"></button>
      </div>
    </div>
  </div>

  <div id="upBox"></div>
  <div id="toast"></div>
  <div id="dropOv" hidden></div>

  <div class="nav">
    <button id="navPlay" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg><span id="navPlayLbl">Play</span></button>
    <button id="navFiles"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg><span id="navFilesLbl">Files</span></button>
  </div>
</div>

<input type="file" id="fileInput" multiple hidden>

<script>
let tok='', lang=localStorage.getItem('weblang')||'en', th=localStorage.getItem('webtheme')||'dk', L={}, st={};
const $=i=>document.getElementById(i);
const enc=encodeURIComponent;
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

/* embedded defaults; lang.json (same directory) overrides them */
const DEF={
  en:{hint:'Enter the code shown on the player',btn:'Enter',bad:'Wrong code',stopped:'Not playing',pl:'Playlist',plempty:'Playlist is empty',
   tabPlay:'Play',tabFiles:'Files',up:'Upload',play:'Play',del:'Delete',cancel:'Cancel',
   delq:'Delete this file?',empty:'Empty',drop:'Drop to upload to the current folder',upfail:'Upload failed',delfail:'Delete failed',
   sd:'Shut down',sdq:'Shut down the player?'},
  zh:{hint:'输入播放器屏幕上显示的验证码',btn:'进入',bad:'验证码错误',stopped:'未在播放',pl:'播放列表',plempty:'播放列表为空',
   tabPlay:'播放',tabFiles:'文件',up:'上传',play:'播放',del:'删除',cancel:'取消',
   delq:'删除这个文件？',empty:'空目录',drop:'松开鼠标上传到当前目录',upfail:'上传失败',delfail:'删除失败',
   sd:'关机',sdq:'确定关机吗？'}};
async function loadLang(){
 try{const j=await (await fetch('/lang.json',{cache:'no-store'})).json();
  L={en:Object.assign({},DEF.en,j.en),zh:Object.assign({},DEF.zh,j.zh)}}
 catch(_){L=DEF}}
const T=()=>L[lang]||DEF.en;

function applyLang(){$('hint').textContent=T().hint;$('loginBtn').textContent=T().btn;
 $('plTitle').textContent=T().pl;
 $('navPlayLbl').textContent=T().tabPlay;$('navFilesLbl').textContent=T().tabFiles;
 $('upLbl').textContent=T().up;$('fPlay').textContent=T().play;$('fDel').textContent=T().del;
  $('fCancel').textContent=T().cancel;$('cfYes').textContent=T().del;$('cfNo').textContent=T().cancel;
  $('sdText').textContent=T().sdq;$('sdYes').textContent=T().sd;$('sdNo').textContent=T().cancel;
  $('dropOv').textContent=T().drop;
 $('langBtn').textContent=lang==='en'?'中文':'EN';
 document.documentElement.lang=lang;}
function toggleLang(){lang=lang==='en'?'zh':'en';localStorage.setItem('weblang',lang);applyLang();}
function applyTheme(){document.body.classList.toggle('lt',th==='lt');
  $('main').classList.toggle('lt',th==='lt');
  $('thBtn').innerHTML=th==='dk'?SUN:MOON;}
function toggleTheme(){th=th==='dk'?'lt':'dk';localStorage.setItem('webtheme',th);applyTheme();}

/* login */
async function login(){
  const r=await fetch('/api/login',{method:'POST',body:'code='+$('code').value.trim().toUpperCase()});
  if(!r.ok){$('err').textContent=T().bad;$('code').classList.remove('shake');
   void $('code').offsetWidth;$('code').classList.add('shake');return}
  tok=(await r.json()).token;sessionStorage.setItem('tok',tok);
  $('login').hidden=true;$('main').hidden=false;ws();
  /* first paint before the websocket connects (battery/title/etc.) */
  fetch('/api/status',{headers:{Authorization:'Bearer '+tok}})
   .then(r=>r.ok?r.json():null).then(s=>{if(s)upd(s)}).catch(()=>{});
}

/* playlist: stable playback order, cur marks the playing track */
let pl=[],plCur=0;
async function loadPl(){
  const box=$('plList');
  if(!box)return;
  try{
   const r=await fetch('/api/playlist',{headers:{Authorization:'Bearer '+tok}});
   if(!r.ok){box.innerHTML='<div style="color:#ec4141">'+(r.status===401?T().bad:'E'+r.status)+'</div>';return}
   const j=await r.json();pl=j.tracks||[];plCur=j.cur||0;
   box.innerHTML='';
   if(!pl.length){box.innerHTML='<div style="color:var(--mut)">'+T().plempty+'</div>';return}
   pl.forEach((t,i)=>{const d=document.createElement('div');
    d.textContent=(i+1)+'. '+(t||'-');if(i===plCur)d.className='cur';
    d.onclick=()=>{post('cmd=jump&param='+i);togglePl(false);setTimeout(loadPl,900)};
    box.appendChild(d)});
   const c=box.children[plCur];if(c)try{c.scrollIntoView({block:'center'})}catch(_){}
  }catch(e){box.innerHTML='<div style="color:#ec4141">✗ '+e.message+'</div>'}}
function togglePl(open){
  const vis=!$('plWrap').hidden;
  const o=(open===undefined)?!vis:open;
  if(o)loadPl();
  $('plWrap').hidden=!o;
}

/* helpers */
const fmt=ms=>{ms=Math.max(0,ms)/1000;const m=Math.floor(ms/60),s=Math.floor(ms%60);return m+':'+(s<10?'0':'')+s};
      const REP_BASE='<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
      const REP_ALL=REP_BASE+'<text x="12" y="16" font-size="9" font-weight="700" text-anchor="middle" fill="currentColor">A</text>';
      const REP_OFF='<path d="M6 7h12M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 17h9m0 0l-3-3m3 3l-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
const REP_ONE=REP_BASE+'<text x="12" y="16.5" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor">1</text>';
const REP_SHUFFLE='<path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>';
const REP_AB=REP_BASE+'<text x="12" y="16" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor">A·B</text>';
function post(body){fetch('/api/cmd',{method:'POST',headers:{Authorization:'Bearer '+tok},body})
 .then(r=>{if(r.status===401){tok='';sessionStorage.removeItem('tok');location.reload()}})
 .catch(()=>{})}
function cmd(c){post('cmd='+c)}
let vt,vAt=0;
function vsend(v){vAt=Date.now();clearTimeout(vt);vt=setTimeout(()=>post('cmd=volume&param='+v),200)}
function seek(e){const r=$('bar').getBoundingClientRect();
  const p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  if(st.len)post('cmd=seek&param='+Math.round(p*st.len))}

/* floating vertical volume */
let vd=false;
function setVolUI(v){v=Math.max(0,Math.min(100,v));
  $('vfill').style.height=v+'%';$('vdot').style.bottom=v+'%';$('vnum').textContent=Math.round(v)}
function volFromEvent(e){const r=$('vslider').getBoundingClientRect();
  const v=(1-(e.clientY-r.top)/r.height)*100;setVolUI(v);vsend(Math.round(v))}
function toggleVol(open){
  const el=$('volWrap');
  const o=(open===undefined)?!el.classList.contains('open'):open;
  if(o)setVolUI(st.vol!==undefined?st.vol:50);
  el.classList.toggle('open',o)}

/* render */
function upd(s){
  st=s;
  $('title').textContent=s.title||'-';
  $('artist').textContent=s.artist?s.artist+(s.album?' · '+s.album:''):(s.album||'');
  $('pos').textContent=fmt(s.pos);$('len').textContent=fmt(s.len);
  const p=s.len?Math.min(100,s.pos*100/s.len):0;
  $('fill').style.width=p+'%';$('dot').style.left=p+'%';
  $('ppIcon').innerHTML=s.state===1?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $('disc').classList.toggle('paused',s.state!==1);
  $('disc').classList.toggle('noaa',!s.aa);
  $('arm').classList.toggle('off',s.state!==1);
  const rp=s.rep===undefined?0:s.rep;
   $('repIco').innerHTML=rp===2?REP_ONE:rp===3?REP_SHUFFLE:rp===4?REP_AB:rp===0?REP_OFF:REP_ALL;
  $('repBtn').classList.toggle('dim',rp===0);
  if(s.bat!==undefined){$('battPct').textContent=s.bat+'%';
   $('battFill').setAttribute('width',(17*Math.max(0,Math.min(100,s.bat))/100).toFixed(1));
   $('batt').classList.toggle('low',s.bat<=15)}
  if(s.state===0&&!s.title){$('title').textContent='-';$('artist').textContent=T().stopped}
  if(!vd&&Date.now()-vAt>800)setVolUI(s.vol);
  if(s.aa){const u='/api/cover?token='+tok+'&v='+s.serial;
   if(!$('cover').src.endsWith(u))$('cover').src=u}
  else $('cover').removeAttribute('src');
}

/* websocket */
let wt;
function ws(){
  let w=new WebSocket('ws'+location.origin.slice(4)+'/ws?token='+tok);
  w.onmessage=e=>{try{upd(JSON.parse(e.data))}catch(_){}};
  w.onclose=()=>{clearTimeout(wt);wt=setTimeout(ws,1200)};
  w.onerror=()=>w.close();
}

/* views */
function switchView(v){
  $('playView').hidden=v!=='play';
  $('filesView').hidden=v!=='files';
  $('navPlay').classList.toggle('on',v==='play');
  $('navFiles').classList.toggle('on',v==='files');
  toggleVol(false);
  if(v==='files'&&fdir===null)loadFiles(null);
}

/* file management */
let fdir=null;
const ICON_DIR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>';
const ICON_FILE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 2.5L18.5 9H14V4.5z"/></svg>';
async function loadFiles(p){
  const box=$('fList');
  try{
   const r=await fetch('/api/files'+(p?('?path='+enc(p)):''),{headers:{Authorization:'Bearer '+tok}});
   if(!r.ok){box.innerHTML='<div style="color:#ec4141;padding:12px">'+(r.status===401?T().bad:'E'+r.status)+'</div>';return}
   const j=await r.json();fdir=j.path||'/';
   const cb=$('crumb');cb.innerHTML='';
   const segs=fdir.split('/').filter(s=>s);
   const mk=(label,path)=>{const b=document.createElement('b');b.textContent=label;
    b.onclick=()=>loadFiles(path);cb.appendChild(b)};
   mk('SD','/');
   let acc='';
   segs.forEach(s=>{acc+='/'+s;
    const sp=document.createElement('span');sp.textContent='/';cb.appendChild(sp);
    mk(s,acc)});
   box.innerHTML='';
   if(!j.dirs.length&&!j.files.length)
    box.innerHTML='<div style="color:var(--mut);padding:14px">'+T().empty+'</div>';
   const mkRow=(n,isdir)=>{const r=document.createElement('div');
    r.className='frow'+(isdir?' isdir':'');
    r.innerHTML=(isdir?ICON_DIR:ICON_FILE)+'<div class="fname"></div>';
    r.querySelector('.fname').textContent=n;
    r.onclick=()=>{if(isdir)loadFiles(fdir==='/'?('/'+n):(fdir+'/'+n));else openFMenu(n)};
    return r};
   j.dirs.forEach(d=>box.appendChild(mkRow(d,true)));
   j.files.forEach(f=>box.appendChild(mkRow(f,false)));
  }catch(e){box.innerHTML='<div style="color:#ec4141;padding:12px">✗ '+e.message+'</div>'}}

let fSel=null;
function openFMenu(name){fSel=name;$('fMenuName').textContent=name;$('fMenu').hidden=false}
function closeFMenu(){$('fMenu').hidden=true}
async function playFile(){
  const r=await fetch('/api/fileop?op=play&path='+enc(fdir+'/'+fSel),
    {method:'POST',headers:{Authorization:'Bearer '+tok}});
  closeFMenu();
  if(r.ok)switchView('play');else toast(T().delfail)}
function askDelete(){
  closeFMenu();
  $('cfName').textContent=T().delq+'\n'+fSel;
  $('fConfirm').hidden=false}
async function doDelete(){
  $('fConfirm').hidden=true;
  const r=await fetch('/api/fileop?op=del&path='+enc(fdir+'/'+fSel),
    {method:'POST',headers:{Authorization:'Bearer '+tok}});
  if(r.ok)loadFiles(fdir);else toast(T().delfail)}

/* uploads with progress */
let upQ=[],upBusy=false;
function queueUpload(files){for(const f of files)upQ.push(f);pumpUpload()}
function pumpUpload(){
  if(upBusy||!upQ.length)return;upBusy=true;
  const f=upQ.shift();
  const row=document.createElement('div');row.className='uprow';
  row.innerHTML='<div class="l1"><span class="n"></span><span class="p"></span></div><div class="pb"><i></i></div>';
  row.querySelector('.n').textContent=f.name;
  const pct=row.querySelector('.p'),bar=row.querySelector('.pb i');
  $('upBox').appendChild(row);
  const xhr=new XMLHttpRequest();
  xhr.open('POST','/api/upload?path='+enc(fdir||'/')+'&name='+enc(f.name));
  xhr.setRequestHeader('Authorization','Bearer '+tok);
  xhr.upload.onprogress=e=>{if(e.lengthComputable){
    const p=Math.round(e.loaded*100/e.total);
    pct.textContent=p+'%';bar.style.width=p+'%'}};
  const done=ok=>{row.remove();upBusy=false;
   if(!ok)toast(T().upfail);
   if(ok&&fdir!==null)loadFiles(fdir);
   pumpUpload()};
  xhr.onload=()=>done(xhr.status===200);
  xhr.onerror=()=>done(false);
  xhr.send(f);
}
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
 clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* drag & drop */
let dragN=0;
async function onDrop(e){
  e.preventDefault();dragN=0;$('dropOv').hidden=true;
  if(fdir===null)await loadFiles(null);
  if(!fdir)fdir='/';
  queueUpload(e.dataTransfer.files)}

/* boot */
(async()=>{
  await loadLang();
  applyLang();
  applyTheme();
  document.addEventListener('dragstart',e=>e.preventDefault());
  $('langBtn').addEventListener('click',toggleLang);
  $('thBtn').addEventListener('click',toggleTheme);
  $('code').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  $('plBtn').addEventListener('click',e=>{e.stopPropagation();togglePl()});
  $('repBtn').addEventListener('click',e=>{e.stopPropagation();cmd('repeat')});
  $('volBtn').addEventListener('click',e=>{e.stopPropagation();toggleVol()});
  $('bar').addEventListener('click',e=>seek(e));
  $('navPlay').addEventListener('click',()=>switchView('play'));
  $('navFiles').addEventListener('click',()=>switchView('files'));
  $('fPlay').addEventListener('click',playFile);
  $('fDel').addEventListener('click',askDelete);
  $('fCancel').addEventListener('click',closeFMenu);
   $('cfYes').addEventListener('click',doDelete);
   $('cfNo').addEventListener('click',()=>$('fConfirm').hidden=true);
   $('sdBtn').addEventListener('click',()=>$('sdWrap').hidden=false);
   $('sdYes').addEventListener('click',()=>{$('sdWrap').hidden=true;post('cmd=shutdown')});
   $('sdNo').addEventListener('click',()=>$('sdWrap').hidden=true);
  $('upBtn').addEventListener('click',async()=>{if(fdir===null)await loadFiles(null);
   $('fileInput').click()});
  $('fileInput').addEventListener('change',e=>{
   if(e.target.files.length){queueUpload(e.target.files)}
   e.target.value=''});
  const vs=$('vslider');
  vs.addEventListener('pointerdown',e=>{vd=true;
   if(vs.setPointerCapture)try{vs.setPointerCapture(e.pointerId)}catch(_){}
   volFromEvent(e)});
  vs.addEventListener('pointermove',e=>{if(vd)volFromEvent(e)});
  const vEnd=()=>{vd=false};
  vs.addEventListener('pointerup',vEnd);vs.addEventListener('pointercancel',vEnd);
  document.addEventListener('pointerdown',e=>{
   if($('volWrap').classList.contains('open')
    &&!$('volWrap').contains(e.target)&&!$('volBtn').contains(e.target))
    toggleVol(false)});
  const card=$('main');
  card.addEventListener('dragenter',e=>{e.preventDefault();
   const t=e.dataTransfer&&e.dataTransfer.types?Array.from(e.dataTransfer.types):[];
   if(t.indexOf('Files')<0)return;
   dragN++;$('dropOv').hidden=false});
  card.addEventListener('dragover',e=>e.preventDefault());
  card.addEventListener('dragleave',e=>{e.preventDefault();
   if(--dragN<=0){dragN=0;$('dropOv').hidden=true}});
  card.addEventListener('drop',onDrop);
  tok=sessionStorage.getItem('tok')||'';
  if(tok){
   const r=await fetch('/api/status',{headers:{Authorization:'Bearer '+tok}});
    if(r.ok){$('login').hidden=true;$('main').hidden=false;upd(await r.json());ws();return}
   tok=''}
  $('code').focus();
})();
</script>
</body>
</html>
